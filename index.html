<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>The Edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f7f3ee; -webkit-text-size-adjust: 100%; }
  input, select, button { font-family: inherit; -webkit-appearance: none; appearance: none; }
  select { background-image: none; }
  input:focus, select:focus { outline: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ─── Constants ────────────────────────────────────────────────────────────────
const CATEGORIES = ["Tops","Bottoms","Dresses & Jumpsuits","Outerwear","Knitwear","Shoes","Bags & Accessories","Sportswear","Formal / Occasionwear","Other"];
const CONDITIONS  = ["Brand new / with tags","Excellent","Good","Fair","Poor / damaged"];
const DECISIONS   = ["Keep","Donate","Sell on Vinted","Bin"];

const DC = {
  "Keep":           { bg:"#f0f4f0", border:"#b8ccb8", text:"#2d4a2d", pill:"#2d4a2d" },
  "Donate":         { bg:"#f0f2f7", border:"#b8c2d8", text:"#2d3a5a", pill:"#2d3a5a" },
  "Sell on Vinted": { bg:"#f7f4ef", border:"#d4c4a8", text:"#5a3e1b", pill:"#8b6340" },
  "Bin":            { bg:"#f7f0f0", border:"#d4b8b8", text:"#5a2d2d", pill:"#8b4040" },
};

const KEEP_Q = [
  "Worn in the last 12 months",
  "Fits well right now",
  "Feel good wearing it",
  "Works with 3+ other items",
];

const F = {
  serif: "'Cormorant Garamond', Georgia, serif",
  sans:  "'Jost', sans-serif",
};

const baseInput = {
  width:"100%", border:"none", borderBottom:"1px solid #d4cec6",
  borderRadius:0, padding:"8px 0", fontSize:13, color:"#1a1a18",
  background:"transparent", fontFamily:F.sans, fontWeight:300,
  boxSizing:"border-box", outline:"none", letterSpacing:"0.02em",
  WebkitAppearance:"none", appearance:"none",
};

const eyebrow = {
  fontFamily:F.sans, fontSize:10, fontWeight:500, letterSpacing:"0.16em",
  textTransform:"uppercase", color:"#a09890", display:"block", marginBottom:6,
};

// ─── API ──────────────────────────────────────────────────────────────────────
async function callClaude({ prompt, imageBase64, imageType, jsonMode }) {
  const content = [];
  if (imageBase64) content.push({ type:"image", source:{ type:"base64", media_type:imageType||"image/jpeg", data:imageBase64 }});
  content.push({ type:"text", text:prompt });
  const body = { model:"claude-sonnet-4-20250514", max_tokens:1000, messages:[{ role:"user", content }] };
  if (jsonMode) body.system = "Respond ONLY with valid JSON. No markdown, no explanation, no backticks.";
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body:JSON.stringify(body),
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e?.error?.message || 'API error ' + res.status); }
  const data = await res.json();
  return data.content?.find(b => b.type==="text")?.text || "";
}

function safeJSON(text) {
  if (!text) return null;
  try { return JSON.parse(text.replace(/```json|```/g,"").trim()); } catch { return null; }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = () => resolve({ data:r.result.split(",")[1], type:file.type });
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function newItem() {
  return {
    id: Date.now() + Math.random(),
    description:"", brand:"", category:CATEGORIES[0], condition:"", notes:"",
    decision:null, aiReason:null, aiDecisionLocked:false,
    keepAnswers:[false,false,false,false],
    imageData:null, imageType:null,
  };
}

// ─── Decision Pill ────────────────────────────────────────────────────────────
function DecisionPill({ decision, isAI }) {
  if (!decision) return null;
  const c = DC[decision];
  return (
    <span style={{
      background:c.bg, border:`1px solid ${c.border}`, color:c.text,
      fontFamily:F.sans, fontSize:10, fontWeight:500, letterSpacing:"0.1em",
      textTransform:"uppercase", borderRadius:2, padding:"3px 10px",
      display:"inline-flex", alignItems:"center", gap:6, whiteSpace:"nowrap",
    }}>
      {isAI && <span style={{ width:5, height:5, borderRadius:"50%", background:c.pill, display:"inline-block", opacity:0.7 }}/>}
      {decision}
    </span>
  );
}

// ─── Photo Autofill ───────────────────────────────────────────────────────────
// Preview derived from props — never goes stale on remount (Bug 1 fix)
function PhotoAutofill({ imageData, imageType, onAutofill }) {
  const [loading, setLoading] = useState(false);
  const inputRef = useRef();

  const preview = imageData && imageType ? `data:${imageType};base64,${imageData}` : null;

  async function handleChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    setLoading(true);
    try {
      const { data, type } = await fileToBase64(file);
      const text = await callClaude({
        prompt:`Analyse this clothing item photo and return JSON with exactly these keys:
{"description":"concise item name","brand":"visible brand or empty string","category":"one of: ${CATEGORIES.join(", ")}","condition":"one of: ${CONDITIONS.join(", ")}","colour":"main colour","material":"fabric if identifiable or empty string"}`,
        imageBase64:data, imageType:type, jsonMode:true,
      });
      const parsed = safeJSON(text);
      onAutofill(parsed || {}, data, type);
    } catch(e) { alert("Photo analysis failed — please try again."); }
    e.target.value = "";
    setLoading(false);
  }

  return (
    <div style={{ marginBottom:20 }}>
      <span style={eyebrow}>Photo</span>
      <div style={{ display:"flex", alignItems:"center", gap:12 }}>
        {preview && (
          <div style={{ position:"relative", flexShrink:0 }}>
            <img src={preview} alt="" style={{ width:52, height:52, objectFit:"cover", borderRadius:2, border:"1px solid #e0dbd4", display:"block" }}/>
            {loading && (
              <div style={{ position:"absolute", inset:0, background:"rgba(247,243,238,0.8)", display:"flex", alignItems:"center", justifyContent:"center", borderRadius:2 }}>
                <span style={{ fontFamily:F.sans, fontSize:9, letterSpacing:"0.1em", textTransform:"uppercase", color:"#5a5248" }}>Reading...</span>
              </div>
            )}
          </div>
        )}
        <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
          <button onClick={() => inputRef.current.click()} disabled={loading}
            style={{ background:"none", border:"1px solid #c8c0b4", borderRadius:2, padding:"6px 14px", fontFamily:F.sans, fontSize:11, fontWeight:500, letterSpacing:"0.08em", textTransform:"uppercase", color:loading?"#b0a898":"#5a5248", cursor:loading?"not-allowed":"pointer" }}>
            {loading ? "Analysing..." : preview ? "Change photo" : "Add photo"}
          </button>
          {preview && !loading && (
            <span style={{ fontFamily:F.sans, fontSize:10, fontWeight:300, color:"#9a9088", fontStyle:"italic" }}>Autofilled from photo</span>
          )}
        </div>
      </div>
      <input ref={inputRef} type="file" accept="image/*" style={{ display:"none" }} onChange={handleChange}/>
    </div>
  );
}

// ─── AI Auto-Decision hook ────────────────────────────────────────────────────
// lockedRef read at fire-time (Bug 2 fix). Scalar props only — no stale item (Bug 3 fix).
function useAIDecision(description, condition, brand, notes, keepAnswers, imageData, imageType, aiDecisionLocked, onDecision) {
  const [loading, setLoading] = useState(false);
  const timerRef  = useRef(null);
  const lockedRef = useRef(aiDecisionLocked);
  lockedRef.current = aiDecisionLocked;

  useEffect(() => {
    if (!description || !condition) return;
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(async () => {
      if (lockedRef.current) return;
      setLoading(true);
      try {
        const text = await callClaude({
          prompt:`You are a wardrobe edit expert for the UK. Decide what the owner should do with this item.
Item: ${description} | Brand: ${brand||"unknown"} | Condition: ${condition} | Notes: ${notes||"none"}
Keep checklist: ${KEEP_Q.map((q,i) => `${q}: ${keepAnswers[i]?"yes":"no"}`).join(", ")}
Return JSON: {"decision":"Keep|Donate|Sell on Vinted|Bin","reason":"one concise sentence"}`,
          imageBase64:imageData, imageType, jsonMode:true,
        });
        const parsed = safeJSON(text);
        if (parsed?.decision && DECISIONS.includes(parsed.decision) && !lockedRef.current) {
          onDecision(parsed.decision, parsed.reason || "");
        }
      } catch(e) {}
      setLoading(false);
    }, 900);
    return () => clearTimeout(timerRef.current);
  }, [description, condition, brand, notes, JSON.stringify(keepAnswers)]);

  return loading;
}

// ─── Vinted Listing ───────────────────────────────────────────────────────────
function VintedListing({ item }) {
  const [data, setData]     = useState(null);
  const [loading, setLoading] = useState(false);

  async function generate() {
    setLoading(true);
    try {
      const text = await callClaude({
        prompt:`UK Vinted selling expert. Return JSON only with these exact keys:
{"price":12,"priceReasoning":"one sentence","title":"listing title under 60 chars","description":"2-3 warm honest sentences","hashtags":["tag1","tag2","tag3","tag4","tag5"]}
price must be a number in GBP based on real UK Vinted market rates for this item, brand and condition.
Item: ${item.description} | Brand: ${item.brand||"unbranded"} | Category: ${item.category} | Condition: ${item.condition} | Notes: ${item.notes||"none"}`,
        jsonMode:true,
      });
      const parsed = safeJSON(text);
      if (parsed) setData(parsed);
    } catch(e) { alert("Could not generate listing — please try again."); }
    setLoading(false);
  }

  return (
    <div style={{ marginTop:24, paddingTop:20, borderTop:"1px solid #e8e2da" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom: data?16:0 }}>
        <span style={{ ...eyebrow, marginBottom:0 }}>Vinted Listing</span>
        <button onClick={generate} disabled={loading}
          style={{ background:"none", border:"1px solid #c8c0b4", borderRadius:2, padding:"5px 12px", fontFamily:F.sans, fontSize:10, fontWeight:500, letterSpacing:"0.1em", textTransform:"uppercase", color:"#5a5248", cursor:loading?"not-allowed":"pointer" }}>
          {loading ? "Generating..." : data ? "Refresh" : "Generate"}
        </button>
      </div>
      {data && (
        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div>
            <span style={eyebrow}>Recommended price</span>
            <div style={{ display:"flex", alignItems:"baseline", gap:10, flexWrap:"wrap" }}>
              <span style={{ fontFamily:F.serif, fontSize:36, fontWeight:300, color:"#1a1a18", lineHeight:1 }}>£{data.price}</span>
              <span style={{ fontFamily:F.sans, fontSize:12, color:"#9a9088", fontWeight:300, fontStyle:"italic" }}>{data.priceReasoning}</span>
            </div>
          </div>
          <div>
            <span style={eyebrow}>Listing title</span>
            <p style={{ margin:0, fontFamily:F.serif, fontSize:18, fontWeight:400, color:"#1a1a18", lineHeight:1.3 }}>{data.title}</p>
          </div>
          <div>
            <span style={eyebrow}>Description</span>
            <p style={{ margin:0, fontFamily:F.sans, fontSize:13, fontWeight:300, color:"#3a3530", lineHeight:1.7 }}>{data.description}</p>
          </div>
          <div>
            <span style={eyebrow}>Hashtags</span>
            <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginTop:4 }}>
              {(data.hashtags||[]).map((t,i) => (
                <span key={i} style={{ fontFamily:F.sans, fontSize:11, letterSpacing:"0.05em", color:"#5a5248", border:"1px solid #d4cec6", borderRadius:2, padding:"3px 9px" }}>#{t}</span>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Similar Items ────────────────────────────────────────────────────────────
function SimilarItems({ items, currentId, onDecideGroup }) {
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [keepId, setKeepId]   = useState(null);

  const others = items.filter(i => i.id !== currentId && i.description);
  if (others.length === 0) return null;

  async function scan() {
    setLoading(true); setResult(null);
    const cur = items.find(i => i.id === currentId);
    try {
      const text = await callClaude({
        prompt:`Wardrobe stylist. Find items similar to the focus item (same category, colour, or function).
Return JSON: {"similarIds":[list of item IDs that are similar],"reason":"one sentence"}
If none, return {"similarIds":[],"reason":"No similar items found."}
Focus (id:${currentId}): ${cur.description} | ${cur.category} | ${cur.brand||""}
Others:\n${others.map(i=>`id:${i.id}|${i.description}|${i.category}|${i.brand||""}`).join("\n")}`,
        jsonMode:true,
      });
      setResult(safeJSON(text));
    } catch(e) {}
    setLoading(false);
  }

  async function applyKeep(kId) {
    setKeepId(kId);
    const cur  = items.find(i => i.id === currentId);
    const sims = (result?.similarIds||[]).map(id => items.find(i => i.id === id)).filter(Boolean);
    for (const itm of [cur, ...sims]) {
      if (itm.id === kId) { onDecideGroup(itm.id, "Keep", "Kept as the preferred version"); continue; }
      try {
        const text = await callClaude({
          prompt:`A better version is being kept. Should this item be Donated or Sold on Vinted?
Item: ${itm.description} | Brand: ${itm.brand||"unknown"} | Condition: ${itm.condition||"unknown"}
Return JSON: {"decision":"Donate","reason":"one sentence"} — decision must be exactly Donate or Sell on Vinted`,
          jsonMode:true,
        });
        const parsed = safeJSON(text);
        onDecideGroup(itm.id, parsed?.decision||"Donate", parsed?.reason||"");
      } catch { onDecideGroup(itm.id, "Donate", ""); }
    }
  }

  const sims = (result?.similarIds||[]).map(id => items.find(i => i.id === id)).filter(Boolean);
  const cur  = items.find(i => i.id === currentId);

  return (
    <div style={{ marginTop:24, paddingTop:20, borderTop:"1px solid #e8e2da" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
        <span style={{ ...eyebrow, marginBottom:0 }}>Similar items</span>
        <button onClick={scan} disabled={loading}
          style={{ background:"none", border:"1px solid #c8c0b4", borderRadius:2, padding:"5px 12px", fontFamily:F.sans, fontSize:10, fontWeight:500, letterSpacing:"0.1em", textTransform:"uppercase", color:"#5a5248", cursor:loading?"not-allowed":"pointer" }}>
          {loading ? "Scanning..." : result ? "Re-scan" : "Scan"}
        </button>
      </div>
      {result && (
        sims.length === 0
          ? <p style={{ fontFamily:F.sans, fontSize:13, fontWeight:300, color:"#9a9088", fontStyle:"italic", margin:0 }}>No similar items found.</p>
          : <>
              <p style={{ fontFamily:F.sans, fontSize:12, fontWeight:300, color:"#7a7068", fontStyle:"italic", margin:"0 0 12px" }}>{result.reason}</p>
              <span style={{ ...eyebrow, marginBottom:8 }}>Which to keep?</span>
              {[cur, ...sims].map(itm => (
                <button key={itm.id} onClick={() => applyKeep(itm.id)} style={{
                  display:"block", width:"100%", textAlign:"left",
                  background: keepId===itm.id ? "#f0f4f0" : "transparent",
                  border:`1px solid ${keepId===itm.id ? "#b8ccb8" : "#e0dbd4"}`,
                  borderRadius:2, padding:"10px 12px", marginBottom:6,
                  fontFamily:F.sans, fontSize:13, fontWeight:keepId===itm.id?500:300,
                  color:"#1a1a18", cursor:"pointer", transition:"all 0.15s",
                }}>
                  {keepId===itm.id && <span style={{ marginRight:8, color:"#2d4a2d", fontSize:10, letterSpacing:"0.08em", textTransform:"uppercase" }}>Kept </span>}
                  {itm.description}
                  {itm.brand && <span style={{ color:"#9a9088", marginLeft:8, fontSize:11 }}>{itm.brand}</span>}
                </button>
              ))}
              {keepId && <p style={{ fontFamily:F.sans, fontSize:12, fontWeight:300, color:"#7a7068", fontStyle:"italic", marginTop:8, marginBottom:0 }}>Others assigned automatically.</p>}
            </>
      )}
    </div>
  );
}

// ─── Item Card ────────────────────────────────────────────────────────────────
function ItemCard({ item, allItems, index, onUpdate, onDelete, onDecideGroup }) {
  const [open, setOpen] = useState(index === 0);

  // Bug 3 fix: merge only changed fields via parent's functional updater
  function upd(fields) { onUpdate(item.id, fields); }

  // Bug 2+3 fix: scalar props, lockedRef at fire-time
  const aiLoading = useAIDecision(
    item.description, item.condition, item.brand, item.notes,
    item.keepAnswers||[false,false,false,false],
    item.imageData, item.imageType, item.aiDecisionLocked,
    (decision, reason) => onUpdate(item.id, { decision, aiReason:reason, aiDecisionLocked:false })
  );

  return (
    <div style={{ borderTop:"1px solid #e0dbd4", background:item.decision ? DC[item.decision].bg+"99" : "transparent", transition:"background 0.3s" }}>

      {/* Header */}
      <div onClick={() => setOpen(o => !o)}
        style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"18px 0", cursor:"pointer", gap:12 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, flex:1, minWidth:0 }}>
          <span style={{ fontFamily:F.serif, fontSize:13, color:"#b0a898", fontStyle:"italic", flexShrink:0, width:18, textAlign:"right" }}>{index+1}</span>
          {item.imageData && (
            <img src={`data:${item.imageType};base64,${item.imageData}`} alt=""
              style={{ width:40, height:40, objectFit:"cover", borderRadius:1, flexShrink:0, border:"1px solid #e0dbd4" }}/>
          )}
          <div style={{ minWidth:0 }}>
            <p style={{ margin:0, fontFamily:F.serif, fontSize:17, fontWeight:400, color:"#1a1a18", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
              {item.description || <span style={{ color:"#b0a898", fontWeight:300, fontSize:15, fontStyle:"italic" }}>New item</span>}
            </p>
            <p style={{ margin:"1px 0 0", fontFamily:F.sans, fontSize:11, fontWeight:300, letterSpacing:"0.04em", color:"#9a9088" }}>
              {item.category}{item.brand ? ` · ${item.brand}` : ""}
              {aiLoading && <span style={{ marginLeft:8, color:"#b0a898" }}> — analysing</span>}
            </p>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
          <DecisionPill decision={item.decision} isAI={!item.aiDecisionLocked && !!item.aiReason}/>
          <span style={{ fontFamily:F.sans, fontSize:12, color:"#b0a898" }}>{open ? "−" : "+"}</span>
        </div>
      </div>

      {/* Body */}
      {open && (
        <div style={{ paddingBottom:28 }}>

          <PhotoAutofill
            imageData={item.imageData} imageType={item.imageType}
            onAutofill={(fields, d, t) => upd({ ...fields, imageData:d, imageType:t, aiDecisionLocked:false, aiReason:null })}
          />

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"16px 20px", marginBottom:20 }}>
            <div style={{ gridColumn:"1/-1" }}>
              <label style={eyebrow}>Description</label>
              <input style={baseInput} placeholder="e.g. Navy wool blazer" value={item.description}
                onChange={e => upd({ description:e.target.value, aiDecisionLocked:false, aiReason:null })}/>
            </div>
            <div>
              <label style={eyebrow}>Brand</label>
              <input style={baseInput} placeholder="e.g. Arket, Zara" value={item.brand}
                onChange={e => upd({ brand:e.target.value })}/>
            </div>
            <div>
              <label style={eyebrow}>Category</label>
              <select style={baseInput} value={item.category} onChange={e => upd({ category:e.target.value })}>
                {CATEGORIES.map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label style={eyebrow}>Condition</label>
              <select style={baseInput} value={item.condition}
                onChange={e => upd({ condition:e.target.value, aiDecisionLocked:false, aiReason:null })}>
                <option value="">Select</option>
                {CONDITIONS.map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label style={eyebrow}>Notes</label>
              <input style={baseInput} placeholder="Optional" value={item.notes}
                onChange={e => upd({ notes:e.target.value })}/>
            </div>
          </div>

          <div style={{ marginBottom:20 }}>
            <span style={eyebrow}>Keep checklist</span>
            {KEEP_Q.map((q,i) => (
              <label key={i} style={{ display:"flex", alignItems:"center", gap:10, marginBottom:9, cursor:"pointer" }}>
                <span style={{
                  width:16, height:16, flexShrink:0, borderRadius:1, transition:"all 0.15s",
                  border:`1px solid ${item.keepAnswers[i] ? "#2d4a2d" : "#c8c0b4"}`,
                  background:item.keepAnswers[i] ? "#2d4a2d" : "transparent",
                  display:"flex", alignItems:"center", justifyContent:"center",
                }}>
                  {item.keepAnswers[i] && <span style={{ color:"#f0f4f0", fontSize:10, lineHeight:1 }}>✓</span>}
                </span>
                <input type="checkbox" checked={item.keepAnswers[i]||false} style={{ display:"none" }}
                  onChange={e => {
                    const a = [...item.keepAnswers];
                    a[i] = e.target.checked;
                    upd({ keepAnswers:a, aiDecisionLocked:false });
                  }}/>
                <span style={{ fontFamily:F.sans, fontSize:13, fontWeight:300, color:"#3a3530" }}>{q}</span>
              </label>
            ))}
          </div>

          {item.aiReason && (
            <div style={{ marginBottom:20, padding:"12px 14px", background:"rgba(255,255,255,0.6)", borderLeft:"2px solid #d4cec6" }}>
              <span style={{ ...eyebrow, marginBottom:4 }}>AI assessment</span>
              <p style={{ margin:0, fontFamily:F.serif, fontSize:14, fontStyle:"italic", color:"#5a5248", lineHeight:1.6 }}>{item.aiReason}</p>
            </div>
          )}

          <div style={{ marginBottom:0 }}>
            <span style={eyebrow}>
              Decision
              {item.aiReason && !item.aiDecisionLocked && (
                <span style={{ fontFamily:F.sans, fontStyle:"italic", textTransform:"none", letterSpacing:0, fontWeight:300, fontSize:10, marginLeft:6 }}> — AI suggested · tap to override</span>
              )}
            </span>
            <div style={{ display:"flex", flexWrap:"wrap", gap:7, marginTop:6 }}>
              {DECISIONS.map(d => {
                const sel = item.decision === d;
                const c   = DC[d];
                return (
                  <button key={d} onClick={() => upd({ decision:sel?null:d, aiDecisionLocked:true })} style={{
                    background:sel ? c.pill : "transparent",
                    border:`1px solid ${sel ? c.pill : "#c8c0b4"}`,
                    color:sel ? "#fff" : "#5a5248",
                    borderRadius:2, padding:"6px 14px",
                    fontFamily:F.sans, fontSize:11, fontWeight:500,
                    letterSpacing:"0.08em", textTransform:"uppercase",
                    cursor:"pointer", transition:"all 0.15s",
                  }}>
                    {d}
                  </button>
                );
              })}
            </div>
          </div>

          <SimilarItems items={allItems} currentId={item.id} onDecideGroup={onDecideGroup}/>
          {item.decision === "Sell on Vinted" && <VintedListing item={item}/>}

          <button onClick={onDelete} style={{
            marginTop:24, background:"none", border:"none", padding:0,
            fontFamily:F.sans, fontSize:10, fontWeight:500, letterSpacing:"0.1em",
            textTransform:"uppercase", color:"#b0a898", cursor:"pointer",
          }}>Remove</button>
        </div>
      )}
    </div>
  );
}

// ─── Summary ──────────────────────────────────────────────────────────────────
function Summary({ items }) {
  const counts    = DECISIONS.reduce((a,d) => ({ ...a, [d]:items.filter(i=>i.decision===d).length }), {});
  const undecided = items.filter(i => !i.decision).length;
  const vinted    = items.filter(i => i.decision === "Sell on Vinted");
  return (
    <div style={{ borderTop:"1px solid #e0dbd4", borderBottom:"1px solid #e0dbd4", padding:"20px 0", marginBottom:32 }}>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"8px 8px" }}>
        {DECISIONS.map(d => (
          <div key={d}>
            <span style={{ ...eyebrow, fontSize:9, marginBottom:3 }}>{d}</span>
            <span style={{ fontFamily:F.serif, fontSize:26, fontWeight:300, color:"#1a1a18", display:"block" }}>{counts[d]}</span>
          </div>
        ))}
      </div>
      {undecided > 0 && <p style={{ fontFamily:F.sans, fontSize:11, fontWeight:300, color:"#9a9088", margin:"10px 0 0", fontStyle:"italic" }}>{undecided} undecided</p>}
      {vinted.length > 0 && (
        <div style={{ marginTop:16, paddingTop:14, borderTop:"1px solid #e8e2da" }}>
          <span style={eyebrow}>Vinted queue</span>
          {vinted.map((it,i) => (
            <p key={i} style={{ margin:"3px 0", fontFamily:F.sans, fontSize:12, fontWeight:300, color:"#5a5248" }}>
              {it.description||"Unnamed"}{it.brand ? ` — ${it.brand}` : ""}
              <span style={{ color:"#b0a898" }}> · {it.condition}</span>
            </p>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [items,   setItems]   = useState([]);
  const [started, setStarted] = useState(false);

  // Bug 3 fix: functional updater — merges only changed fields, never stale
  function updateItem(id, fields) { setItems(p => p.map(i => i.id===id ? { ...i, ...fields } : i)); }
  function addItem()      { setItems(p => [...p, newItem()]); }
  function deleteItem(id) { setItems(p => p.filter(i => i.id !== id)); }
  function decideGroup(id, decision, reason) {
    setItems(p => p.map(i => i.id===id ? { ...i, decision, aiReason:reason, aiDecisionLocked:false } : i));
  }

  if (!started) return (
    <div style={{ minHeight:"100vh", background:"#f7f3ee", display:"flex", alignItems:"center", justifyContent:"center", padding:32, fontFamily:F.sans }}>
      <div style={{ maxWidth:340 }}>
        <p style={{ fontFamily:F.serif, fontStyle:"italic", letterSpacing:"0.12em", color:"#9a9088", margin:"0 0 20px", textTransform:"uppercase", fontSize:11 }}>Wardrobe Edit</p>
        <h1 style={{ fontFamily:F.serif, fontSize:46, fontWeight:300, color:"#1a1a18", margin:"0 0 18px", lineHeight:1.0, letterSpacing:"-0.02em" }}>The Edit</h1>
        <div style={{ width:40, height:1, background:"#c8c0b4", marginBottom:24 }}/>
        <p style={{ fontFamily:F.sans, fontSize:13, fontWeight:300, color:"#5a5248", lineHeight:1.85, margin:"0 0 28px" }}>
          Add each item, answer a short checklist, and receive an AI verdict on whether to keep, donate, sell or bin — with ready-to-post Vinted listings and GBP market pricing.
        </p>
        {[
          ["Photo autofill",  "Details fill in from a photo automatically"],
          ["AI decisions",    "Instant AI recommendation on each item"],
          ["Similar items",   "Resolve duplicates across your wardrobe"],
          ["Vinted ready",    "Priced listing with description and hashtags"],
        ].map(([t,d]) => (
          <div key={t} style={{ display:"flex", gap:14, marginBottom:12 }}>
            <span style={{ fontFamily:F.sans, fontSize:10, fontWeight:500, letterSpacing:"0.1em", textTransform:"uppercase", color:"#9a9088", paddingTop:1, flexShrink:0, width:88 }}>{t}</span>
            <span style={{ fontFamily:F.sans, fontSize:12, fontWeight:300, color:"#5a5248", lineHeight:1.6 }}>{d}</span>
          </div>
        ))}
        <button onClick={() => { setStarted(true); setItems([newItem()]); }}
          style={{ marginTop:32, background:"#1a1a18", color:"#f5f0e8", border:"none", borderRadius:2, padding:"15px 34px", fontFamily:F.sans, fontSize:11, fontWeight:500, letterSpacing:"0.14em", textTransform:"uppercase", cursor:"pointer" }}>
          Begin
        </button>
      </div>
    </div>
  );

  return (
    <div style={{ minHeight:"100vh", background:"#f7f3ee", fontFamily:F.sans, paddingBottom:80 }}>
      <div style={{ padding:"28px 24px 0", maxWidth:540, margin:"0 auto" }}>
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", marginBottom:4 }}>
          <h1 style={{ fontFamily:F.serif, fontSize:24, fontWeight:300, color:"#1a1a18", margin:0, letterSpacing:"-0.01em" }}>The Edit</h1>
          <span style={{ fontFamily:F.sans, fontSize:11, fontWeight:300, color:"#9a9088" }}>{items.length} item{items.length!==1?"s":""}</span>
        </div>
        <div style={{ height:1, background:"#1a1a18", marginBottom:24 }}/>
      </div>

      <div style={{ maxWidth:540, margin:"0 auto", padding:"0 24px" }}>
        {items.length > 0 && <Summary items={items}/>}

        {items.map((item,i) => (
          <ItemCard key={item.id} item={item} allItems={items} index={i}
            onUpdate={updateItem} onDelete={() => deleteItem(item.id)} onDecideGroup={decideGroup}/>
        ))}

        <div style={{ paddingTop:24 }}>
          <button onClick={addItem} style={{
            background:"none", border:"none", fontFamily:F.sans, fontSize:11, fontWeight:500,
            letterSpacing:"0.12em", textTransform:"uppercase", color:"#5a5248",
            cursor:"pointer", padding:0, display:"flex", alignItems:"center", gap:8,
          }}>
            <span style={{ fontSize:18, fontWeight:300, lineHeight:1 }}>+</span> Add item
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
